<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Xyko tá Rico">
<title>Xyko tá Rico</title>
<meta name="theme-color" content="#2F5D4E">

<style>
  :root{
    --bg: #EFF3EE;
    --surface: #FFFFFF;
    --ink: #1F2E27;
    --ink-soft: #5B6B62;
    --primary: #2F5D4E;
    --accent: #C9A227;
    --expense: #B54B3F;
    --income: #3F7D5C;
    --line: #D8E0D8;
    --line-strong: #C3D0C3;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    padding-bottom:100px;
  }
  .app{max-width:480px;margin:0 auto;padding:0 16px;}

  header.top{
    padding:calc(22px + env(safe-area-inset-top)) 16px 10px;
    max-width:480px;
    margin:0 auto;
  }
  header.top h1{
    font-family:Georgia,'Iowan Old Style',serif;
    font-size:26px;
    font-weight:400;
    margin:0;
    color:var(--primary);
    letter-spacing:0.2px;
  }
  header.top p{
    margin:4px 0 0;
    font-size:13px;
    color:var(--ink-soft);
  }

  .month-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:18px 0 12px;
  }
  .month-nav button{
    background:var(--surface);
    border:1px solid var(--line-strong);
    color:var(--primary);
    width:36px;height:36px;
    border-radius:50%;
    font-size:16px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .month-nav button:active{ background:var(--line); }
  .month-label{
    font-family:Georgia,serif;
    font-size:17px;
    color:var(--ink);
  }

  .summary-card{
    background:var(--primary);
    color:#F3F6F1;
    border-radius:var(--radius);
    padding:22px 20px;
    position:relative;
    overflow:hidden;
  }
  .summary-card::after{
    content:"";
    position:absolute;
    right:-30px;top:-30px;
    width:120px;height:120px;
    border-radius:50%;
    background:rgba(255,255,255,0.06);
  }
  .summary-net-label{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    opacity:0.75;
  }
  .summary-net{
    font-family:Georgia,serif;
    font-size:38px;
    margin:4px 0 14px;
    font-variant-numeric:tabular-nums;
  }
  .summary-row{
    display:flex;
    gap:18px;
    font-size:13px;
  }
  .summary-row div{flex:1;}
  .summary-row .amt{
    font-size:17px;
    font-variant-numeric:tabular-nums;
    margin-top:2px;
    font-weight:600;
  }
  .in-color{color:#BFE3CE;}
  .out-color{color:#F3C6BE;}

  .section-title{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--ink-soft);
    margin:26px 4px 10px;
  }

  .cat-bar-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
    font-size:13px;
  }
  .cat-bar-name{width:110px; flex-shrink:0; color:var(--ink-soft);}
  .cat-bar-track{
    flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;
  }
  .cat-bar-fill{height:100%; background:var(--accent); border-radius:4px;}
  .cat-bar-amt{width:64px; text-align:right; flex-shrink:0; font-variant-numeric:tabular-nums;}

  .ledger{
    background:var(--surface);
    border-radius:var(--radius);
    padding:4px 16px;
    margin-top:8px;
  }
  .entry{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 0;
    border-bottom:1px dashed var(--line-strong);
  }
  .entry:last-child{border-bottom:none;}
  .entry .mid{flex:1; min-width:0;}
  .entry .cat{
    font-size:14px; font-weight:600; color:var(--ink);
  }
  .entry .meta{
    font-size:12px; color:var(--ink-soft); margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .entry .amt{
    font-variant-numeric:tabular-nums;
    font-size:15px;
    font-weight:600;
    flex-shrink:0;
  }
  .entry .amt.expense{color:var(--expense);}
  .entry .amt.income{color:var(--income);}
  .entry .del{
    background:none;border:none;color:var(--ink-soft);
    font-size:18px; padding:4px 2px; cursor:pointer; flex-shrink:0;
  }

  .empty{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-soft);
    font-size:14px;
  }

  .fab{
    position:fixed;
    bottom:28px; right:24px;
    width:60px;height:60px;
    border-radius:50%;
    background:var(--accent);
    color:#2A2205;
    border:none;
    font-size:28px;
    box-shadow:0 6px 18px rgba(0,0,0,0.25);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    z-index:20;
  }
  .fab:active{transform:scale(0.95);}

  .sheet-backdrop{
    position:fixed; inset:0;
    background:rgba(20,30,25,0.4);
    z-index:30;
    display:none;
    align-items:flex-end;
  }
  .sheet-backdrop.open{display:flex;}
  .sheet{
    background:var(--surface);
    width:100%;
    max-width:480px;
    margin:0 auto;
    border-radius:20px 20px 0 0;
    padding:20px 20px calc(24px + env(safe-area-inset-bottom));
    max-height:88vh;
    overflow-y:auto;
  }
  .sheet h2{
    font-family:Georgia,serif;
    font-weight:400;
    font-size:20px;
    margin:0 0 16px;
    color:var(--primary);
  }
  .toggle-row{
    display:flex; gap:8px; margin-bottom:16px;
  }
  .toggle-row button{
    flex:1;
    padding:10px;
    border-radius:10px;
    border:1px solid var(--line-strong);
    background:var(--surface);
    font-size:14px; font-weight:600;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .toggle-row button.active.expense{
    background:var(--expense); color:white; border-color:var(--expense);
  }
  .toggle-row button.active.income{
    background:var(--income); color:white; border-color:var(--income);
  }
  label{
    display:block;
    font-size:12px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.8px;
    margin:14px 0 6px;
  }
  input,select,textarea{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid var(--line-strong);
    font-size:16px;
    font-family:inherit;
    background:var(--bg);
    color:var(--ink);
  }
  textarea{resize:none; min-height:44px;}
  .sheet-actions{
    display:flex; gap:10px; margin-top:20px;
  }
  .sheet-actions button{
    flex:1;
    padding:14px;
    border-radius:10px;
    border:none;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .btn-cancel{background:var(--bg); color:var(--ink-soft);}
  .btn-save{background:var(--primary); color:white;}

  .status{
    text-align:center; font-size:12px; color:var(--ink-soft); margin-top:18px;
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Xyko tá Rico</h1>
    <p>Compartilhado entre Pai e Rodrigo</p>
  </header>

  <div class="month-nav">
    <button id="prevMonth">‹</button>
    <div class="month-label" id="monthLabel">—</div>
    <button id="nextMonth">›</button>
  </div>

  <div class="summary-card">
    <div class="summary-net-label">Saldo do mês</div>
    <div class="summary-net" id="netAmt">$0</div>
    <div class="summary-row">
      <div>
        <div>Entradas</div>
        <div class="amt in-color" id="inAmt">$0</div>
      </div>
      <div>
        <div>Saídas</div>
        <div class="amt out-color" id="outAmt">$0</div>
      </div>
    </div>
  </div>

  <div class="section-title" id="catTitle" style="display:none;">Por categoria</div>
  <div id="catBars"></div>

  <div class="section-title">Lançamentos</div>
  <div class="ledger" id="ledgerList">
    <div class="empty">Carregando…</div>
  </div>

  <div class="status" id="statusLine"></div>
</div>

<button class="fab" id="openAdd" aria-label="Adicionar lançamento">+</button>

<div class="sheet-backdrop" id="backdrop">
  <div class="sheet">
    <h2>Novo lançamento</h2>
    <div class="toggle-row">
      <button type="button" id="typeExpense" class="active expense">Despesa</button>
      <button type="button" id="typeIncome" class="income">Receita</button>
    </div>

    <label>Valor</label>
    <input type="number" inputmode="decimal" id="amountInput" placeholder="0.00" step="0.01">

    <label>Categoria</label>
    <select id="categoryInput"></select>

    <label>Data</label>
    <input type="date" id="dateInput">

    <label>Observação (opcional)</label>
    <textarea id="noteInput" placeholder="ex: mercado, farmácia..."></textarea>

    <div class="sheet-actions">
      <button class="btn-cancel" id="cancelAdd">Cancelar</button>
      <button class="btn-save" id="saveAdd">Salvar</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAUp5DqyuWV72z12SShBDd3OG4KPUefWV0",
  authDomain: "xyko-1f524.firebaseapp.com",
  databaseURL: "https://xyko-1f524-default-rtdb.firebaseio.com",
  projectId: "xyko-1f524",
  storageBucket: "xyko-1f524.firebasestorage.app",
  messagingSenderId: "158983546652",
  appId: "1:158983546652:web:6a26c89cbf371d7d397cd9"
};
let entriesRef = null;
let firebaseError = null;
try{
  firebase.initializeApp(firebaseConfig);
  entriesRef = firebase.database().ref('entries');
}catch(e){
  console.error('Firebase init failed:', e);
  firebaseError = e;
  window.addEventListener('DOMContentLoaded', () => {
    const el = document.getElementById('statusLine');
    if(el) el.textContent = "Erro ao iniciar: " + (e && e.message ? e.message : e);
  });
}

const EXPENSE_CATS = ["Mercado","Moradia","Contas","Transporte","Saúde","Seguro","Restaurante","Compras","Lazer","Outros"];
const INCOME_CATS = ["Salário","Aposentadoria","Presente","Outras receitas"];

let entries = [];
let currentType = "expense";
let viewDate = new Date();

const fmt = (n) => {
  const sign = n < 0 ? "-" : "";
  return sign + "$" + Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:0, maximumFractionDigits:0});
};

function populateCategories(){
  const sel = document.getElementById('categoryInput');
  sel.innerHTML = "";
  const list = currentType === "expense" ? EXPENSE_CATS : INCOME_CATS;
  list.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    sel.appendChild(opt);
  });
}

function setType(t){
  currentType = t;
  document.getElementById('typeExpense').classList.toggle('active', t === 'expense');
  document.getElementById('typeIncome').classList.toggle('active', t === 'income');
  populateCategories();
}

document.getElementById('typeExpense').onclick = () => setType('expense');
document.getElementById('typeIncome').onclick = () => setType('income');

document.getElementById('openAdd').onclick = () => {
  document.getElementById('amountInput').value = "";
  document.getElementById('noteInput').value = "";
  document.getElementById('dateInput').value = new Date().toISOString().slice(0,10);
  setType('expense');
  document.getElementById('backdrop').classList.add('open');
};
document.getElementById('cancelAdd').onclick = () => {
  document.getElementById('backdrop').classList.remove('open');
};

document.getElementById('saveAdd').onclick = async () => {
  const amount = parseFloat(document.getElementById('amountInput').value);
  if(!amount || amount <= 0){
    alert("Digite um valor maior que 0.");
    return;
  }
  const entry = {
    id: 'e_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    type: currentType,
    amount: amount,
    category: document.getElementById('categoryInput').value,
    date: document.getElementById('dateInput').value || new Date().toISOString().slice(0,10),
    note: document.getElementById('noteInput').value.trim(),
    createdAt: Date.now()
  };
  entries.push(entry);
  document.getElementById('backdrop').classList.remove('open');
  render();
  await persist();
};

function entriesToObj(arr){
  const o = {};
  arr.forEach(e => { o[e.id] = e; });
  return o;
}
function objToEntries(obj){
  return obj ? Object.values(obj) : [];
}

async function persist(){
  const statusEl = document.getElementById('statusLine');
  if(!entriesRef){
    statusEl.textContent = "Sem conexão com o banco compartilhado" + (firebaseError ? (": " + firebaseError.message) : "") + " — lançamento salvo só neste aparelho.";
    return;
  }
  try{
    statusEl.textContent = "Salvando…";
    await entriesRef.set(entriesToObj(entries));
    statusEl.textContent = "Salvo · compartilhado com Pai e Rodrigo";
  }catch(e){
    console.error(e);
    statusEl.textContent = "Não foi possível salvar — verifique sua conexão.";
  }
}

function load(){
  const statusEl = document.getElementById('statusLine');
  if(!entriesRef){
    statusEl.textContent = "Sem conexão com o banco compartilhado" + (firebaseError ? (": " + firebaseError.message) : "") + ".";
    render();
    return;
  }
  statusEl.textContent = "Conectando…";
  entriesRef.on('value', (snapshot) => {
    entries = objToEntries(snapshot.val());
    statusEl.textContent = "Compartilhado com Pai e Rodrigo";
    render();
  }, (err) => {
    console.error(err);
    statusEl.textContent = "Não foi possível conectar — verifique sua internet.";
  });
}

async function deleteEntry(id){
  entries = entries.filter(e => e.id !== id);
  render();
  await persist();
}

function monthKey(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,'0'); }

function render(){
  const mk = monthKey(viewDate);
  document.getElementById('monthLabel').textContent = viewDate.toLocaleDateString('pt-BR',{month:'long', year:'numeric'});

  const monthEntries = entries.filter(e => e.date && e.date.slice(0,7) === mk)
                               .sort((a,b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);

  const income = monthEntries.filter(e => e.type === 'income').reduce((s,e)=>s+e.amount,0);
  const expense = monthEntries.filter(e => e.type === 'expense').reduce((s,e)=>s+e.amount,0);
  const net = income - expense;

  document.getElementById('netAmt').textContent = fmt(net);
  document.getElementById('netAmt').style.color = net < 0 ? '#F3C6BE' : '#F3F6F1';
  document.getElementById('inAmt').textContent = fmt(income);
  document.getElementById('outAmt').textContent = fmt(expense);

  const catTotals = {};
  monthEntries.filter(e=>e.type==='expense').forEach(e=>{
    catTotals[e.category] = (catTotals[e.category]||0) + e.amount;
  });
  const catEntries = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
  const catTitle = document.getElementById('catTitle');
  const catBarsEl = document.getElementById('catBars');
  catBarsEl.innerHTML = "";
  if(catEntries.length){
    catTitle.style.display = "block";
    const max = catEntries[0][1];
    catEntries.forEach(([cat,amt])=>{
      const row = document.createElement('div');
      row.className = 'cat-bar-row';
      row.innerHTML = `<div class="cat-bar-name">${cat}</div><div class="cat-bar-track"><div class="cat-bar-fill" style="width:${(amt/max*100).toFixed(0)}%"></div></div><div class="cat-bar-amt">${fmt(amt)}</div>`;
      catBarsEl.appendChild(row);
    });
  } else {
    catTitle.style.display = "none";
  }

  const listEl = document.getElementById('ledgerList');
  listEl.innerHTML = "";
  if(monthEntries.length === 0){
    listEl.innerHTML = '<div class="empty">Nenhum lançamento este mês.<br>Toque em + para adicionar o primeiro.</div>';
    return;
  }
  monthEntries.forEach(e => {
    const row = document.createElement('div');
    row.className = 'entry';
    const dateLabel = new Date(e.date + 'T00:00:00').toLocaleDateString('pt-BR',{month:'short', day:'numeric'});
    row.innerHTML = `
      <div class="mid">
        <div class="cat">${e.category}</div>
        <div class="meta">${dateLabel}${e.note ? ' · ' + e.note : ''}</div>
      </div>
      <div class="amt ${e.type}">${e.type === 'expense' ? '-' : '+'}${fmt(e.amount)}</div>
      <button class="del" data-id="${e.id}" aria-label="Excluir">×</button>
    `;
    listEl.appendChild(row);
  });
  listEl.querySelectorAll('.del').forEach(btn=>{
    btn.onclick = () => deleteEntry(btn.dataset.id);
  });
}

document.getElementById('prevMonth').onclick = () => {
  viewDate.setMonth(viewDate.getMonth()-1);
  render();
};
document.getElementById('nextMonth').onclick = () => {
  viewDate.setMonth(viewDate.getMonth()+1);
  render();
};

document.getElementById('backdrop').onclick = (e) => {
  if(e.target.id === 'backdrop') document.getElementById('backdrop').classList.remove('open');
};

populateCategories();
load();
</script>
</body>
</html>
