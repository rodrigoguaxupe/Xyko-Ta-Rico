<meta name="theme-color" content="#2F5D4E">

<style>
  :root{
    --bg: #EFF3EE;
    --surface: #FFFFFF;
    --ink: #1F2E27;
    --ink-soft: #5B6B62;
    --primary: #2F5D4E;
    --accent: #C9A227;
    --expense: #B54B3F;
    --income: #3F7D5C;
    --line: #D8E0D8;
    --line-strong: #C3D0C3;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    padding-bottom:100px;
  }
  .app{max-width:480px;margin:0 auto;padding:0 16px;}

  header.top{
    padding:calc(22px + env(safe-area-inset-top)) 16px 10px;
    max-width:480px;
    margin:0 auto;
  }
  header.top h1{
    font-family:Georgia,'Iowan Old Style',serif;
    font-size:26px;
    font-weight:400;
    margin:0;
    color:var(--primary);
    letter-spacing:0.2px;
  }
  header.top p{
    margin:4px 0 0;
    font-size:13px;
    color:var(--ink-soft);
  }

  .month-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:18px 0 12px;
  }
  .month-nav button{
    background:var(--surface);
    border:1px solid var(--line-strong);
    color:var(--primary);
    width:36px;height:36px;
    border-radius:50%;
    font-size:16px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .month-nav button:active{ background:var(--line); }
  .month-label{
    font-family:Georgia,serif;
    font-size:17px;
    color:var(--ink);
  }

  .summary-card{
    background:var(--primary);
    color:#F3F6F1;
    border-radius:var(--radius);
    padding:22px 20px;
    position:relative;
    overflow:hidden;
  }
  .summary-card::after{
    content:"";
    position:absolute;
    right:-30px;top:-30px;
    width:120px;height:120px;
    border-radius:50%;
    background:rgba(255,255,255,0.06);
  }
  .summary-net-label{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    opacity:0.75;
  }
  .summary-net{
    font-family:Georgia,serif;
    font-size:38px;
    margin:4px 0 14px;
    font-variant-numeric:tabular-nums;
  }
  .summary-row{
    display:flex;
    gap:18px;
    font-size:13px;
  }
  .summary-row div{flex:1;}
  .summary-row .amt{
    font-size:17px;
    font-variant-numeric:tabular-nums;
    margin-top:2px;
    font-weight:600;
  }
  .in-color{color:#BFE3CE;}
  .out-color{color:#F3C6BE;}

  .section-title{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--ink-soft);
    margin:26px 4px 10px;
  }

  .cat-bar-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
    font-size:13px;
  }
  .cat-bar-name{width:110px; flex-shrink:0; color:var(--ink-soft);}
  .cat-bar-track{
    flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;
  }
  .cat-bar-fill{height:100%; background:var(--accent); border-radius:4px;}
  .cat-bar-amt{width:64px; text-align:right; flex-shrink:0; font-variant-numeric:tabular-nums;}

  .ledger{
    background:var(--surface);
    border-radius:var(--radius);
    padding:4px 16px;
    margin-top:8px;
  }
  .entry{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 0;
    border-bottom:1px dashed var(--line-strong);
  }
  .entry:last-child{border-bottom:none;}
  .entry .mid{flex:1; min-width:0;}
  .entry .cat{
    font-size:14px; font-weight:600; color:var(--ink);
  }
  .entry .meta{
    font-size:12px; color:var(--ink-soft); margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .entry .amt{
    font-variant-numeric:tabular-nums;
    font-size:15px;
    font-weight:600;
    flex-shrink:0;
  }
  .entry .amt.expense{color:var(--expense);}
  .entry .amt.income{color:var(--income);}
  .entry .del{
    background:none;border:none;color:var(--ink-soft);
    font-size:18px; padding:4px 2px; cursor:pointer; flex-shrink:0;
  }

  .empty{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-soft);
    font-size:14px;
  }

  .fab{
    position:fixed;
    bottom:28px; right:24px;
    width:60px;height:60px;
    border-radius:50%;
    background:var(--accent);
    color:#2A2205;
    border:none;
    font-size:28px;
    box-shadow:0 6px 18px rgba(0,0,0,0.25);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    z-index:20;
  }
  .fab:active{transform:scale(0.95);}

  .sheet-backdrop{
    position:fixed; inset:0;
    background:rgba(20,30,25,0.4);
    z-index:30;
    display:none;
    align-items:flex-end;
  }
  .sheet-backdrop.open{display:flex;}
  .sheet{
    background:var(--surface);
    width:100%;
    max-width:480px;
    margin:0 auto;
    border-radius:20px 20px 0 0;
    padding:20px 20px calc(24px + env(safe-area-inset-bottom));
    max-height:88vh;
    overflow-y:auto;
  }
  .sheet h2{
    font-family:Georgia,serif;
    font-weight:400;
    font-size:20px;
    margin:0 0 16px;
    color:var(--primary);
  }
  .toggle-row{
    display:flex; gap:8px; margin-bottom:16px;
  }
  .toggle-row button{
    flex:1;
    padding:10px;
    border-radius:10px;
    border:1px solid var(--line-strong);
    background:var(--surface);
    font-size:14px; font-weight:600;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .toggle-row button.active.expense{
    background:var(--expense); color:white; border-color:var(--expense);
  }
  .toggle-row button.active.income{
    background:var(--income); color:white; border-color:var(--income);
  }
  label{
    display:block;
    font-size:12px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.8px;
    margin:14px 0 6px;
  }
  input,select,textarea{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid var(--line-strong);
    font-size:16px;
    font-family:inherit;
    background:var(--bg);
    color:var(--ink);
  }
  textarea{resize:none; min-height:44px;}
  .sheet-actions{
    display:flex; gap:10px; margin-top:20px;
  }
  .sheet-actions button{
    flex:1;
    padding:14px;
    border-radius:10px;
    border:none;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .btn-cancel{background:var(--bg); color:var(--ink-soft);}
  .btn-save{background:var(--primary); color:white;}

  .status{
    text-align:center; font-size:12px; color:var(--ink-soft); margin-top:18px;
  }
  .goal-card{
    background:var(--surface);
    border:1px solid var(--line-strong);
    border-radius:var(--radius);
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:18px;
  }
  .goal-icon{font-size:22px; flex-shrink:0;}
  .goal-info{flex:1; min-width:0;}
  .goal-text{font-size:13px; color:var(--ink); font-weight:600; margin-bottom:6px;}
  .goal-bar-track{height:7px; background:var(--line); border-radius:4px; overflow:hidden;}
  .goal-bar-fill{height:100%; background:var(--accent); border-radius:4px; transition:width .3s ease;}
  .updated-line{
    text-align:right; font-size:11px; color:var(--ink-soft); margin:8px 4px 0;
  }
  .field-row{
    display:flex; align-items:center; gap:8px; margin-top:16px;
  }
  .field-row input[type="checkbox"]{
    width:18px; height:18px; flex-shrink:0;
  }
  .inline-label{
    margin:0 !important; text-transform:none !important; font-size:14px !important;
    color:var(--ink) !important; letter-spacing:normal !important;
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Xyko tá Rico</h1>
  </header>

  <div class="goal-card" id="goalCard">
    <div class="goal-icon">✈️</div>
    <div class="goal-info">
      <div class="goal-text" id="goalText">Carregando meta…</div>
      <div class="goal-bar-track"><div class="goal-bar-fill" id="goalBarFill" style="width:0%"></div></div>
    </div>
  </div>

  <div class="updated-line" id="updatedLine"></div>

  <div class="month-nav">
    <button id="prevMonth">‹</button>
    <div class="month-label" id="monthLabel">—</div>
    <button id="nextMonth">›</button>
  </div>

  <div class="summary-card">
    <div class="summary-net-label">Saldo do mês</div>
    <div class="summary-net" id="netAmt">$0</div>
    <div class="summary-row">
      <div>
        <div>Entradas</div>
        <div class="amt in-color" id="inAmt">$0</div>
      </div>
      <div>
        <div>Saídas</div>
        <div class="amt out-color" id="outAmt">$0</div>
      </div>
    </div>
  </div>

  <div class="section-title" id="catTitle" style="display:none;">Por categoria</div>
  <div id="catBars"></div>

  <div class="section-title">Lançamentos</div>
  <div class="ledger" id="ledgerList">
    <div class="empty">Carregando…</div>
  </div>

  <div class="status" id="statusLine"></div>
</div>

<button class="fab" id="openAdd" aria-label="Adicionar lançamento">+</button>

<div class="sheet-backdrop" id="backdrop">
  <div class="sheet">
    <h2 id="sheetTitle">Novo lançamento</h2>
    <div class="toggle-row">
      <button type="button" id="typeExpense" class="active expense">Despesa</button>
      <button type="button" id="typeIncome" class="income">Receita</button>
    </div>

    <label>Valor</label>
    <input type="number" inputmode="decimal" id="amountInput" placeholder="0.00" step="0.01">

    <div id="categoryFieldWrap">
      <label>Categoria</label>
      <select id="categoryInput"></select>
    </div>

    <div class="field-row" id="parcelarRow" style="display:none;">
      <input type="checkbox" id="parcelarCheck">
      <label class="inline-label" for="parcelarCheck">Parcelar em várias vezes</label>
    </div>
    <div id="installmentsField" style="display:none;">
      <label>Em quantas vezes?</label>
      <input type="number" id="installmentsInput" min="2" max="24" value="2" inputmode="numeric">
    </div>

    <label>Data</label>
    <input type="date" id="dateInput">

    <label>Observação (opcional)</label>
    <textarea id="noteInput" placeholder="ex: mercado, farmácia..."></textarea>

    <div class="sheet-actions">
      <button class="btn-cancel" id="cancelAdd">Cancelar</button>
      <button class="btn-save" id="saveAdd">Salvar</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAUp5DqyuWV72z12SShBDd3OG4KPUefWV0",
  authDomain: "xyko-1f524.firebaseapp.com",
  databaseURL: "https://xyko-1f524-default-rtdb.firebaseio.com",
  projectId: "xyko-1f524",
  storageBucket: "xyko-1f524.firebasestorage.app",
  messagingSenderId: "158983546652",
  appId: "1:158983546652:web:6a26c89cbf371d7d397cd9"
};
let entriesRef = null;
let goalRef = null;
let firebaseError = null;
try{
  firebase.initializeApp(firebaseConfig);
  entriesRef = firebase.database().ref('entries');
  goalRef = firebase.database().ref('goal');
}catch(e){
  console.error('Firebase init failed:', e);
  firebaseError = e;
  window.addEventListener('DOMContentLoaded', () => {
    const el = document.getElementById('statusLine');
    if(el) el.textContent = "Erro ao iniciar: " + (e && e.message ? e.message : e);
  });
}

const EXPENSE_CATS = ["Supermercado","Médico/Farmácia","Manutenção Casa","Restaurantes","Compras","Lazer","Presentes","Igreja"];
const INCOME_CATS = ["Receita"];

let entries = [];
let currentType = "expense";
let viewDate = new Date();
let editingId = null;
let goalResetAt = "2000-01-01";
const GOAL_STEP = 5000;

const fmt = (n) => {
  const sign = n < 0 ? "-" : "";
  return sign + "R$" + Math.abs(n).toLocaleString('pt-BR',{minimumFractionDigits:0, maximumFractionDigits:0});
};

function populateCategories(){
  const sel = document.getElementById('categoryInput');
  sel.innerHTML = "";
  const list = currentType === "expense" ? EXPENSE_CATS : INCOME_CATS;
  list.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    sel.appendChild(opt);
  });
}

function setType(t){
  currentType = t;
  document.getElementById('typeExpense').classList.toggle('active', t === 'expense');
  document.getElementById('typeIncome').classList.toggle('active', t === 'income');
  populateCategories();
  document.getElementById('categoryFieldWrap').style.display = (t === 'income') ? 'none' : 'block';
  updateParcelarVisibility();
}

function updateParcelarVisibility(){
  const showParcelar = currentType === 'expense' && !editingId;
  document.getElementById('parcelarRow').style.display = showParcelar ? 'flex' : 'none';
  if(!showParcelar){
    document.getElementById('parcelarCheck').checked = false;
    document.getElementById('installmentsField').style.display = 'none';
  }
}

document.getElementById('parcelarCheck').onchange = (e) => {
  document.getElementById('installmentsField').style.display = e.target.checked ? 'block' : 'none';
};

document.getElementById('typeExpense').onclick = () => setType('expense');
document.getElementById('typeIncome').onclick = () => setType('income');

document.getElementById('openAdd').onclick = () => {
  editingId = null;
  document.getElementById('sheetTitle').textContent = "Novo lançamento";
  document.getElementById('amountInput').value = "";
  document.getElementById('noteInput').value = "";
  document.getElementById('dateInput').value = new Date().toISOString().slice(0,10);
  document.getElementById('parcelarCheck').checked = false;
  document.getElementById('installmentsField').style.display = 'none';
  document.getElementById('installmentsInput').value = 2;
  setType('expense');
  document.getElementById('backdrop').classList.add('open');
};

function openEditSheet(entry){
  editingId = entry.id;
  document.getElementById('sheetTitle').textContent = "Editar lançamento";
  setType(entry.type);
  document.getElementById('amountInput').value = entry.amount;
  document.getElementById('categoryInput').value = entry.category;
  document.getElementById('dateInput').value = entry.date;
  document.getElementById('noteInput').value = entry.note || "";
  updateParcelarVisibility();
  document.getElementById('backdrop').classList.add('open');
}
document.getElementById('cancelAdd').onclick = () => {
  document.getElementById('backdrop').classList.remove('open');
};

document.getElementById('saveAdd').onclick = async () => {
  const amount = parseFloat(document.getElementById('amountInput').value);
  if(!amount || amount <= 0){
    alert("Digite um valor maior que 0.");
    return;
  }
  const date = document.getElementById('dateInput').value || new Date().toISOString().slice(0,10);
  const category = document.getElementById('categoryInput').value;
  const note = document.getElementById('noteInput').value.trim();

  const isParcelado = !editingId && currentType === 'expense' && document.getElementById('parcelarCheck').checked;
  const installments = isParcelado
    ? Math.max(2, Math.min(24, parseInt(document.getElementById('installmentsInput').value) || 2))
    : 1;

  if(editingId){
    const idx = entries.findIndex(e => e.id === editingId);
    if(idx !== -1){
      entries[idx] = { ...entries[idx], type: currentType, amount, category, date, note };
    }
  } else if(installments > 1){
    const totalCents = Math.round(amount * 100);
    const baseCents = Math.floor(totalCents / installments);
    const remainder = totalCents - (baseCents * installments);
    const baseDate = new Date(date + 'T00:00:00');
    for(let i = 0; i < installments; i++){
      const cents = baseCents + (i === installments - 1 ? remainder : 0);
      const d = new Date(baseDate);
      d.setMonth(d.getMonth() + i);
      entries.push({
        id: 'e_' + Date.now() + '_' + i + '_' + Math.random().toString(36).slice(2,5),
        type: 'expense',
        amount: cents / 100,
        category: category,
        date: d.toISOString().slice(0,10),
        note: note,
        createdAt: Date.now(),
        installmentIndex: i + 1,
        installmentTotal: installments
      });
    }
  } else {
    entries.push({
      id: 'e_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
      type: currentType,
      amount: amount,
      category: category,
      date: date,
      note: note,
      createdAt: Date.now()
    });
  }
  editingId = null;
  document.getElementById('backdrop').classList.remove('open');
  render();
  await persist();
};

function entriesToObj(arr){
  const o = {};
  arr.forEach(e => { o[e.id] = e; });
  return o;
}
function objToEntries(obj){
  return obj ? Object.values(obj) : [];
}

async function persist(){
  const statusEl = document.getElementById('statusLine');
  if(!entriesRef){
    statusEl.textContent = "Sem conexão com o banco compartilhado" + (firebaseError ? (": " + firebaseError.message) : "") + " — lançamento salvo só neste aparelho.";
    return;
  }
  try{
    statusEl.textContent = "Salvando…";
    await entriesRef.set(entriesToObj(entries));
    statusEl.textContent = "Salvo · compartilhado com Pai e Rodrigo";
  }catch(e){
    console.error(e);
    statusEl.textContent = "Não foi possível salvar — verifique sua conexão.";
  }
}

function load(){
  const statusEl = document.getElementById('statusLine');
  if(!entriesRef){
    statusEl.textContent = "Sem conexão com o banco compartilhado" + (firebaseError ? (": " + firebaseError.message) : "") + ".";
    render();
    return;
  }
  statusEl.textContent = "Conectando…";
  entriesRef.on('value', (snapshot) => {
    entries = objToEntries(snapshot.val());
    statusEl.textContent = "Compartilhado com Pai e Rodrigo";
    render();
  }, (err) => {
    console.error(err);
    statusEl.textContent = "Não foi possível conectar — verifique sua internet.";
  });
  if(goalRef){
    goalRef.on('value', (snapshot) => {
      const data = snapshot.val();
      goalResetAt = (data && data.resetAt) ? data.resetAt : "2000-01-01";
      render();
    });
  }
}

async function deleteEntry(id){
  entries = entries.filter(e => e.id !== id);
  render();
  await persist();
}

function monthKey(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,'0'); }

function render(){
  renderGoal();
  renderUpdatedLine();
  const mk = monthKey(viewDate);
  document.getElementById('monthLabel').textContent = viewDate.toLocaleDateString('pt-BR',{month:'long', year:'numeric'});

  const monthEntries = entries.filter(e => e.date && e.date.slice(0,7) === mk)
                               .sort((a,b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);

  const income = monthEntries.filter(e => e.type === 'income').reduce((s,e)=>s+e.amount,0);
  const expense = monthEntries.filter(e => e.type === 'expense').reduce((s,e)=>s+e.amount,0);
  const net = income - expense;

  document.getElementById('netAmt').textContent = fmt(net);
  document.getElementById('netAmt').style.color = net < 0 ? '#F3C6BE' : '#F3F6F1';
  document.getElementById('inAmt').textContent = fmt(income);
  document.getElementById('outAmt').textContent = fmt(expense);

  const catTotals = {};
  monthEntries.filter(e=>e.type==='expense').forEach(e=>{
    catTotals[e.category] = (catTotals[e.category]||0) + e.amount;
  });
  const catEntries = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
  const catTitle = document.getElementById('catTitle');
  const catBarsEl = document.getElementById('catBars');
  catBarsEl.innerHTML = "";
  if(catEntries.length){
    catTitle.style.display = "block";
    const max = catEntries[0][1];
    catEntries.forEach(([cat,amt])=>{
      const row = document.createElement('div');
      row.className = 'cat-bar-row';
      row.innerHTML = `<div class="cat-bar-name">${cat}</div><div class="cat-bar-track"><div class="cat-bar-fill" style="width:${(amt/max*100).toFixed(0)}%"></div></div><div class="cat-bar-amt">${fmt(amt)}</div>`;
      catBarsEl.appendChild(row);
    });
  } else {
    catTitle.style.display = "none";
  }

  const listEl = document.getElementById('ledgerList');
  listEl.innerHTML = "";
  if(monthEntries.length === 0){
    listEl.innerHTML = '<div class="empty">Nenhum lançamento este mês.<br>Toque em + para adicionar o primeiro.</div>';
    return;
  }
  monthEntries.forEach(e => {
    const row = document.createElement('div');
    row.className = 'entry';
    row.style.cursor = 'pointer';
    const dateLabel = new Date(e.date + 'T00:00:00').toLocaleDateString('pt-BR',{month:'short', day:'numeric'});
    const installmentTag = e.installmentTotal ? ` · (${e.installmentIndex}/${e.installmentTotal})` : '';
    row.innerHTML = `
      <div class="mid">
        <div class="cat">${e.category}</div>
        <div class="meta">${dateLabel}${e.note ? ' · ' + e.note : ''}${installmentTag}</div>
      </div>
      <div class="amt ${e.type}">${e.type === 'expense' ? '-' : '+'}${fmt(e.amount)}</div>
      <button class="del" data-id="${e.id}" aria-label="Excluir">×</button>
    `;
    row.addEventListener('click', (evt) => {
      if(evt.target.closest('.del')) return;
      openEditSheet(e);
    });
    row.querySelector('.del').onclick = (evt) => {
      evt.stopPropagation();
      deleteEntry(e.id);
    };
    listEl.appendChild(row);
  });
}

document.getElementById('prevMonth').onclick = () => {
  viewDate.setMonth(viewDate.getMonth()-1);
  render();
};
document.getElementById('nextMonth').onclick = () => {
  viewDate.setMonth(viewDate.getMonth()+1);
  render();
};

document.getElementById('backdrop').onclick = (e) => {
  if(e.target.id === 'backdrop') document.getElementById('backdrop').classList.remove('open');
};

function renderGoal(){
  const goalNet = entries
    .filter(e => e.date && e.date >= goalResetAt)
    .reduce((s,e) => s + (e.type === 'income' ? e.amount : -e.amount), 0);

  let target = GOAL_STEP;
  while(goalNet >= target){ target += GOAL_STEP; }

  const remaining = target - goalNet;
  const pct = Math.max(0, Math.min(100, (goalNet / target) * 100));
  const textEl = document.getElementById('goalText');
  const fillEl = document.getElementById('goalBarFill');

  fillEl.style.width = pct.toFixed(0) + "%";
  textEl.textContent = "Faltam " + fmt(remaining) + " para a passagem pra ver o Luca";
}

function renderUpdatedLine(){
  const el = document.getElementById('updatedLine');
  if(!entries.length){ el.textContent = ""; return; }
  const latest = Math.max(...entries.map(e => e.createdAt || 0));
  if(!latest){ el.textContent = ""; return; }
  const time = new Date(latest).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  el.textContent = "Atualizado às " + time;
}

populateCategories();
load();
</script>
</body>
</html>
